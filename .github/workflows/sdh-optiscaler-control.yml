name: SDH OptiScaler Control Build

on:
  push:
    branches:
      - sdh-optiscaler-control-dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Prepare MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download and verify supported SDH OptiScaler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/allians00758/steam_deck_helper_library/releases/download/dlls/sd-helper-optiscaler.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\sd-helper-optiscaler.tar.gz"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\opti" | Out-Null
          tar -xzf "$env:RUNNER_TEMP\sd-helper-optiscaler.tar.gz" -C "$env:RUNNER_TEMP\opti"
          $dxgi = Get-ChildItem "$env:RUNNER_TEMP\opti" -Recurse -Filter dxgi.dll | Select-Object -First 1
          if (-not $dxgi) { throw "dxgi.dll not found" }
          $sha = (Get-FileHash $dxgi.FullName -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "e903f639c05aaf9cda3bc6fd18d1f21b9fd8143b97dddd7f63146a53868aca6f") {
            throw "Unsupported dxgi.dll SHA: $sha"
          }
          "SUPPORTED_DXGI_SHA=$sha" | Out-File "$env:GITHUB_WORKSPACE\sdh-control-build.txt" -Encoding utf8
          $vi = (Get-Item $dxgi.FullName).VersionInfo
          "DXGI_VERSION=$($vi.ProductVersion)" | Add-Content "$env:GITHUB_WORKSPACE\sdh-control-build.txt"

      - name: Clone exact OptiScaler headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone --recursive https://github.com/optiscaler/OptiScaler.git "$env:RUNNER_TEMP\OptiScaler"
          Set-Location "$env:RUNNER_TEMP\OptiScaler"
          git checkout 8dac650cbf90c85ca1d46747a66fc98118be75b8
          git submodule update --init --recursive

      - name: Build standalone SDH control ASI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = "$env:RUNNER_TEMP\OptiScaler"
          $cpp = "$env:GITHUB_WORKSPACE\dev\sdh-optiscaler-control\sdh-optiscaler-control.cpp"
          $out = "$env:GITHUB_WORKSPACE\sdh-optiscaler-control.dll"

          $includes = @(
            "$src\OptiScaler",
            "$src\OptiScaler\include",
            "$src\external\vulkan\include",
            "$src\external\nvngx_dlss_sdk",
            "$src\external\xess\inc\xess",
            "$src\external\xess\inc\xell",
            "$src\external\xess\inc\xess_fg",
            "$src\external\FidelityFX-SDK\ffx-api\include\ffx_api",
            "$src\external\simpleini",
            "$src\external\unordered_dense\include",
            "$src\external\spdlog\include",
            "$src\external\freetype",
            "$src\external\streamline",
            "$src\external\streamline1",
            "$src\external\nvapi",
            "$src\external\nlohmann",
            "$src\external\fakenvapi",
            "$src\external\magic_enum\include\magic_enum"
          )
          $incArgs = @()
          foreach ($i in $includes) { $incArgs += "/I$i" }

          & cl.exe /nologo /std:c++latest /EHsc /O2 /MD /LD /DWIN32 /D_WINDOWS @incArgs $cpp /Fe:$out /link bcrypt.lib
          if ($LASTEXITCODE -ne 0) { throw "cl.exe failed: $LASTEXITCODE" }
          if (-not (Test-Path $out)) { throw "helper dll was not produced" }

          Move-Item -Force $out "$env:GITHUB_WORKSPACE\sdh-optiscaler-control.asi"
          "HELPER_SHA=$((Get-FileHash "$env:GITHUB_WORKSPACE\sdh-optiscaler-control.asi" -Algorithm SHA256).Hash.ToLower())" |
            Add-Content "$env:GITHUB_WORKSPACE\sdh-control-build.txt"
          "HELPER_SIZE=$((Get-Item "$env:GITHUB_WORKSPACE\sdh-optiscaler-control.asi").Length)" |
            Add-Content "$env:GITHUB_WORKSPACE\sdh-control-build.txt"

      - name: Verify helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          "=== EXPORTS ===" | Add-Content sdh-control-build.txt
          & dumpbin.exe /nologo /exports "$env:GITHUB_WORKSPACE\sdh-optiscaler-control.asi" | Add-Content sdh-control-build.txt
          "=== DEPENDENTS ===" | Add-Content sdh-control-build.txt
          & dumpbin.exe /nologo /dependents "$env:GITHUB_WORKSPACE\sdh-optiscaler-control.asi" | Add-Content sdh-control-build.txt
          $exports = (& dumpbin.exe /nologo /exports "$env:GITHUB_WORKSPACE\sdh-optiscaler-control.asi" | Out-String)
          if ($exports -notmatch "InitializeASI") { throw "InitializeASI export missing" }
          Get-Content sdh-control-build.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sdh-optiscaler-control
          path: |
            sdh-optiscaler-control.asi
            sdh-control-build.txt
